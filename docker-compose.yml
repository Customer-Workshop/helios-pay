services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    env_file: .env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  core-api:
    build: ./services/core-api
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
  partner-gateway:
    build: ./services/partner-gateway
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      core-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 20
  ledger-worker:
    build: ./services/ledger-worker
    env_file: .env
    ports: ["8090:8090"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./web
    env_file: .env
    environment:
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      core-api: {condition: service_healthy}
      partner-gateway: {condition: service_healthy}
      ledger-worker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 20
  metadata:
    image: python:3.12-slim
    env_file: .env
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                body = json.dumps({"instance-id": "i-helios-demo", "iam-role": "demo-role"}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def do_POST(self):
                self.do_GET()
            def log_message(self, *_args):
                pass
        HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/')"]
      interval: 5s
      timeout: 3s
      retries: 20
  attacker:
    image: python:3.12-slim
    hostname: attacker
    env_file: .env
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(302)
                self.send_header("Location", "http://metadata/latest/meta-data/iam/")
                self.end_headers()
            def do_POST(self):
                self.do_GET()
            def log_message(self, *_args):
                pass
        HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
